name: Diagnostico de red

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probar variantes y escribir el informe
        run: |
          mkdir -p docs
          OUT=docs/diagnostico.txt
          {
            echo "Diagnostico de acceso a rebelion.org  --  $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "IP publica del runner: $(curl -sS -m 20 https://api.ipify.org || echo desconocida)"
            echo
          } > "$OUT"

          probar() {
            NOMBRE="$1"; UA="$2"; URL="$3"
            CODIGO=$(curl -sS -o /tmp/cuerpo -D /tmp/cab -A "$UA" -m 30 -w '%{http_code}' "$URL" 2>/dev/null || echo "curl-error")
            MIT=$(grep -i '^cf-mitigated:' /tmp/cab 2>/dev/null | tr -d '\r' || true)
            SRV=$(grep -i '^server:' /tmp/cab 2>/dev/null | tr -d '\r' || true)
            TIT=$(head -c 2000 /tmp/cuerpo 2>/dev/null | grep -o '<title>[^<]*</title>' | head -1 || true)
            PRIM=$(head -c 90 /tmp/cuerpo 2>/dev/null | tr -d '\n')
            {
              echo "### $NOMBRE"
              echo "    url    : $URL"
              echo "    HTTP   : $CODIGO   $SRV   $MIT"
              echo "    title  : $TIT"
              echo "    inicio : $PRIM"
              echo
            } >> "$OUT"
          }

          REST='https://rebelion.org/wp-json/wp/v2/categories?slug=ecuador'
          HTML='https://rebelion.org/categoria/territorios/america-latina-y-caribe/ecuador/'

          probar "bot UA (el que usa el script)" 'rebpodcast-feedbot/1.0 (+https://github.com/robertoroseteg-cloud)' "$REST"
          probar "UA de Chrome en Linux"          'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36' "$REST"
          probar "UA de Firefox en Windows"       'Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:127.0) Gecko/20100101 Firefox/127.0' "$REST"
          probar "curl por defecto"               'curl/8.5.0' "$REST"
          probar "feedparser"                     'feedparser/6.0.11 +https://github.com/kurtmckee/feedparser/' "$REST"
          probar "Googlebot"                      'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' "$REST"
          probar "Chrome sobre el HTML"           'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36' "$HTML"

          echo "=== control: un sitio sin Cloudflare ===" >> "$OUT"
          probar "control example.com"             'rebpodcast-feedbot/1.0' 'https://example.com/'

          cat "$OUT"

      - name: Publicar el informe
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostico.txt
          git diff --staged --quiet || { git commit -m "Diagnostico de red"; git push; }
