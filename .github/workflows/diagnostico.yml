name: Diagnostico de red

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Salida del runner
        run: |
          echo "IP publica del runner:"
          curl -sS -m 20 https://api.ipify.org || echo "(sin ipify)"
          echo
          echo "DNS de rebelion.org:"
          getent hosts rebelion.org || echo "(sin resolucion)"

      - name: rebelion.org con el UA del bot
        run: |
          UA='rebpodcast-feedbot/1.0 (+https://github.com/robertoroseteg-cloud)'
          for U in 'https://rebelion.org/wp-json/wp/v2/categories?slug=ecuador' \
                   'https://rebelion.org/categoria/territorios/america-latina-y-caribe/ecuador/' \
                   'https://rebelion.org/'; do
            echo "======== $U"
            curl -sS -o /tmp/cuerpo -D /tmp/cabeceras -A "$UA" -m 30 \
                 -w 'HTTP %{http_code}  en %{time_total}s  tipo=%{content_type}  bytes=%{size_download}\n' \
                 "$U" || echo "curl fallo con codigo $?"
            echo "--- cabeceras:"; head -15 /tmp/cabeceras 2>/dev/null
            echo "--- cuerpo (300):"; head -c 300 /tmp/cuerpo 2>/dev/null; echo
          done

      - name: La misma peticion con UA de navegador
        run: |
          NAV='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          echo "======== REST con UA de navegador"
          curl -sS -o /tmp/c2 -D /tmp/h2 -A "$NAV" -m 30 \
               -w 'HTTP %{http_code}  en %{time_total}s  bytes=%{size_download}\n' \
               'https://rebelion.org/wp-json/wp/v2/categories?slug=ecuador' || echo "curl fallo con codigo $?"
          echo "--- cabeceras:"; head -15 /tmp/h2 2>/dev/null
          echo "--- cuerpo (300):"; head -c 300 /tmp/c2 2>/dev/null; echo

      - name: Lo mismo desde python-requests
        run: |
          pip install requests --quiet
          python3 - <<'PY'
          import requests
          for ua in ["rebpodcast-feedbot/1.0 (+https://github.com/robertoroseteg-cloud)",
                     "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"]:
              try:
                  r = requests.get("https://rebelion.org/wp-json/wp/v2/categories",
                                   params={"slug": "ecuador"},
                                   headers={"User-Agent": ua, "Accept": "text/html,application/xhtml+xml,application/xml,*/*",
                                            "Accept-Language": "es-ES,es;q=0.9"},
                                   timeout=30)
                  print(f"UA={ua[:40]!r} -> HTTP {r.status_code}  {r.headers.get('content-type')}  {len(r.content)} bytes")
                  print("   cuerpo:", r.text[:200].replace("\n", " "))
                  print("   server:", r.headers.get("server"), "| cf-ray:", r.headers.get("cf-ray"))
              except Exception as e:
                  print(f"UA={ua[:40]!r} -> EXCEPCION {type(e).__name__}: {e}")
          PY
